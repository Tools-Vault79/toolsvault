<!DOCTYPE html>
<html lang="en"><head>

<meta property="og:title" content="Word Counter – Count Words and Characters Online | ToolVault">

<meta property="og:type" content="website">
<meta property="og:site_name" content="ToolVault">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="../css/style.css">
<style>
.toolhero{text-align:center;padding:50px 0 25px}.toolhero h1{font-size:clamp(34px,5vw,48px);color:#0B1220}.toolhero p{max-width:680px;margin:10px auto;color:#64748B}
.workspace{max-width:900px;margin:20px auto 70px}.panel{background:#fff;border:1px solid #E2E8F0;border-radius:18px;padding:25px}
textarea{width:100%;min-height:260px;padding:14px;border:1px solid #CBD5E1;border-radius:10px;font:inherit;resize:vertical}
.btnfull{border:0;border-radius:10px;padding:12px 16px;background:#2563EB;color:#fff;font-weight:700;cursor:pointer;margin:7px 7px 0 0}.secondary{background:#fff;color:#0B1220;border:1px solid #E2E8F0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:11px;padding:13px;text-align:center}.stat span{display:block;font-size:11px;color:#64748B}.stat strong{font-size:22px;color:#0B1220}
@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}}
</style></head>
<body><header><div class="container nav"><a class="logo" href="../index.html"><span>T</span>ToolVault</a><a href="../index.html" style="color:#2563EB;font-weight:700;text-decoration:none;font-size:14px">← Back to Tools</a></div></header>
<section class="toolhero"><div class="container"><div class="badge">FREE TOOL</div><h1>Word & Character Counter</h1><p>Count words, characters, sentences and paragraphs instantly.</p></div></section>
<main class="container workspace"><div class="panel"><textarea id="text" placeholder="Type or paste your text here..."></textarea>
<div class="stats"><div class="stat"><span>Words</span><strong id="words">0</strong></div><div class="stat"><span>Characters</span><strong id="chars">0</strong></div><div class="stat"><span>Sentences</span><strong id="sentences">0</strong></div><div class="stat"><span>Paragraphs</span><strong id="paragraphs">0</strong></div></div>
<button class="btnfull" onclick="clearText()">Clear</button></div></main>
<footer><div class="container"><span>© 2026 ToolVault</span><span>Practical digital tools for smarter work.</span></div></footer>
<script>const t=document.getElementById("text");function count(){let v=t.value;document.getElementById("words").textContent=v.trim()?v.trim().split(/\s+/).length:0;document.getElementById("chars").textContent=v.length;document.getElementById("sentences").textContent=(v.match(/[.!?]+(?=\s|$)/g)||[]).length;document.getElementById("paragraphs").textContent=v.trim()?v.trim().split(/\n\s*\n/).length:0}function clearText(){t.value="";count()}t.addEventListener("input",count);count();</script></body></html>
