<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Expense Calculator — ToolVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1220;--blue:#2563EB;--cyan:#06B6D4;--bg:#F8FAFC;--white:#fff;--text:#111827;--muted:#64748B;--border:#E2E8F0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}h1,h2,h3{font-family:"Space Grotesk",Arial,sans-serif}
.container{width:min(1050px,92%);margin:auto}header{background:#fff;border-bottom:1px solid var(--border)}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}
.logo{font:700 23px "Space Grotesk";color:var(--navy);text-decoration:none}.logo span{display:inline-flex;width:31px;height:31px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;align-items:center;justify-content:center;margin-right:8px}
.back{color:var(--blue);font-weight:700;text-decoration:none;font-size:14px}.hero{text-align:center;padding:50px 0 25px}.badge{display:inline-block;background:#EFF6FF;color:var(--blue);border:1px solid #DBEAFE;padding:7px 13px;border-radius:30px;font-size:11px;font-weight:800;margin-bottom:13px}.hero h1{font-size:clamp(34px,5vw,48px);line-height:1.1;color:var(--navy);margin:0 0 10px}.hero p{max-width:680px;margin:auto;color:var(--muted)}
.workspace{display:grid;grid-template-columns:370px 1fr;gap:22px;margin:20px auto 70px;align-items:start}.panel{background:#fff;border:1px solid var(--border);border-radius:18px;padding:23px}.panel h2{margin:0 0 18px;color:var(--navy);font-size:21px}
.field{margin-bottom:13px}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}input,textarea,select{width:100%;padding:11px;border:1px solid #CBD5E1;border-radius:9px;font:inherit;font-size:13px}textarea{min-height:90px;resize:vertical}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:10px;padding:12px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;margin-top:7px}.secondary{background:#fff;color:var(--navy);border:1px solid var(--border)}
.result{background:#fff;border:1px solid var(--border);border-radius:18px;padding:23px}.result h2{margin:0 0 17px;color:var(--navy);font-size:21px}.output{white-space:pre-wrap;background:#F8FAFC;border:1px solid var(--border);border-radius:12px;padding:17px;min-height:220px;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:15px;border:1px solid var(--border);border-radius:12px;background:#F8FAFC}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:23px;color:var(--navy)}
footer{background:var(--navy);color:#94A3B8;padding:25px 0;font-size:12px}footer .container{display:flex;justify-content:space-between}
@media(max-width:820px){.workspace{grid-template-columns:1fr}}@media(max-width:520px){.row,.stats{grid-template-columns:1fr}}
</style>
<style id="toolvault-paywall-css">
.tv-protected-output{position:relative;overflow:hidden}
.tv-output-mask{position:absolute;inset:0;z-index:50;background:rgba(248,250,252,.97);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;min-height:180px}
.tv-output-lock{max-width:430px}
.tv-output-lock span{display:block;font-size:30px;margin-bottom:8px}
.tv-output-lock strong{display:block;font-size:20px;color:#0B1220;margin-bottom:7px}
.tv-output-lock small{display:block;color:#64748B;line-height:1.5;margin-bottom:16px}
.tv-output-lock button,.tv-buy{display:inline-block;border:0;border-radius:10px;padding:12px 18px;background:#2563EB;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}
.tv-modal{display:none;position:fixed;inset:0;z-index:9999}
.tv-modal.open{display:block}
.tv-modal-backdrop{position:absolute;inset:0;background:rgba(11,18,32,.65);backdrop-filter:blur(3px)}
.tv-modal-card{position:relative;width:min(520px,calc(100% - 32px));margin:10vh auto 0;background:#fff;border-radius:20px;padding:32px;box-shadow:0 24px 80px rgba(0,0,0,.25);text-align:center}
.tv-modal-close{position:absolute;right:14px;top:10px;border:0;background:none;font-size:28px;color:#64748B;cursor:pointer}
.tv-lock{font-size:34px}
.tv-kicker{font-size:12px;font-weight:800;letter-spacing:.12em;color:#2563EB;margin:8px 0}
.tv-modal-card h2{margin:5px 0 10px;color:#0B1220}
.tv-modal-card p{color:#64748B;line-height:1.6;margin:0 auto 18px;max-width:430px}
.tv-benefits{display:grid;grid-template-columns:1fr 1fr;gap:9px;text-align:left;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;padding:14px;margin:18px 0 20px;color:#334155;font-size:14px}
.tv-note{font-size:12px;color:#94A3B8;margin-top:12px}
body.tv-modal-open{overflow:hidden}
@media(max-width:560px){.tv-benefits{grid-template-columns:1fr}.tv-modal-card{padding:28px 20px}}
</style></head>
<body>
<header><div class="container nav"><a class="logo" href="../index.html"><span>T</span>ToolVault</a><a class="back" href="../index.html">← Back to Tools</a></div></header>
<section class="hero"><div class="container"><div class="badge">FINANCE TOOL</div><h1>Expense Calculator</h1><p>Calculate total business expenses, remaining budget and expense ratio.</p></div></section>
<main class="container workspace"><div class="panel"><h2>Monthly Expenses</h2>
<div class="field"><label>Monthly Budget ($)</label><input id="budget" type="number" value="3000"></div>
<div class="field"><label>Rent / Office ($)</label><input class="e" type="number" value="500"></div>
<div class="field"><label>Utilities ($)</label><input class="e" type="number" value="150"></div>
<div class="field"><label>Software ($)</label><input class="e" type="number" value="100"></div>
<div class="field"><label>Marketing ($)</label><input class="e" type="number" value="200"></div>
<div class="field"><label>Other ($)</label><input class="e" type="number" value="100"></div>
<button class="btn"  onclick="ToolVaultPaywall.show()">Calculate</button></div>
<div class="result"><h2>Summary</h2><div class="stats"><div class="stat"><span>Total Expenses</span><strong id="total">$0</strong></div><div class="stat"><span>Remaining</span><strong id="remaining">$0</strong></div><div class="stat"><span>Expense Ratio</span><strong id="ratio">0%</strong></div><div class="stat"><span>Largest Expense</span><strong id="largest">—</strong></div></div></div></main>
<footer><div class="container"><span>© 2026 ToolVault</span><span>Practical digital tools for smarter work.</span></div></footer>
<script>function money(x){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(x)}function calc(){let b=+budget.value||0,v=[...document.querySelectorAll(".e")].map(x=>+x.value||0),names=["Rent","Utilities","Software","Marketing","Other"],t=v.reduce((a,x)=>a+x,0),m=Math.max(...v);total.textContent=money(t);remaining.textContent=money(b-t);ratio.textContent=(b?t/b*100:0).toFixed(1)+"%";largest.textContent=m?names[v.indexOf(m)]:"—"}calc();</script>
<script>window.TOOLVAULT_PAYWALL={checkout:"https://zafcommander.gumroad.com/l/expense-calculator?wanted=true",toolName:"Expense Calculator"};</script><script src="../js/paywall.js"></script></body></html>
