.toolhero{text-align:center;padding:50px 0 25px}.toolhero h1{font-size:clamp(34px,5vw,48px);color:#0B1220}.toolhero p{max-width:680px;margin:10px auto;color:#64748B}
.workspace{max-width:900px;margin:20px auto 70px}.panel{background:#fff;border:1px solid #E2E8F0;border-radius:18px;padding:25px}
textarea{width:100%;min-height:260px;padding:14px;border:1px solid #CBD5E1;border-radius:10px;font:inherit;resize:vertical}
.btnfull{border:0;border-radius:10px;padding:12px 16px;background:#2563EB;color:#fff;font-weight:700;cursor:pointer;margin:7px 7px 0 0}.secondary{background:#fff;color:#0B1220;border:1px solid #E2E8F0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:11px;padding:13px;text-align:center}.stat span{display:block;font-size:11px;color:#64748B}.stat strong{font-size:22px;color:#0B1220}

<body><header><div class="container nav"><a class="logo" href="../index.html"><span>T</span>ToolVault</a><a href="../index.html" style="color:#2563EB;font-weight:700;text-decoration:none;font-size:14px">← Back to Tools</a></div></header>
<section class="toolhero"><div class="container"><div class="badge">FREE TOOL</div><h1>Text Case Converter</h1><p>Convert text into common writing cases with one click.</p></div></section>
<main class="container workspace"><div class="panel"><textarea id="text" placeholder="Type or paste your text here..."></textarea>
<button class="btnfull" onclick="convert('upper')">UPPERCASE</button><button class="btnfull" onclick="convert('lower')">lowercase</button><button class="btnfull" onclick="convert('title')">Title Case</button><button class="btnfull" onclick="convert('sentence')">Sentence case</button><button class="btnfull secondary" onclick="clearText()">Clear</button></div></main>
<footer><div class="container"><span>© 2026 ToolVault</span><span>Practical digital tools for smarter work.</span></div></footer>
<script>const t=document.getElementById("text");function convert(type){let v=t.value;if(type==="upper")t.value=v.toUpperCase();if(type==="lower")t.value=v.toLowerCase();if(type==="title")t.value=v.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());if(type==="sentence")t.value=v.toLowerCase().replace(/(^|[.!?]\s+)([a-z])/g,(m,p,c)=>p+c.toUpperCase())}function clearText(){t.value=""}</script></body></html>
