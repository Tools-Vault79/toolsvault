<section class="hero"><div class="container"><div class="badge">CONTENT TOOL</div><h1>Content Calendar Generator</h1><p>Generate a simple 30-day content calendar around a topic and audience.</p></div></section>
<main class="container workspace"><div class="panel"><h2>Calendar Setup</h2>
<div class="field"><label>Brand</label><input id="brand" value="My Business"></div>
<div class="field"><label>Main Topic</label><input id="topic" value="Digital productivity"></div>
<div class="field"><label>Audience</label><input id="audience" value="Small business owners"></div>
<div class="field"><label>Posts Per Week</label><select id="freq"><option value="3">3</option><option value="5">5</option><option value="7">7</option></select></div>
<button class="btn"  onclick="ToolVaultPaywall.show()">Generate Calendar</button></div>
<div class="result"><h2>30-Day Calendar</h2><div id="output" class="output"></div><button class="btn"  onclick="ToolVaultPaywall.show()">Copy Calendar</button></div></main>
<footer><div class="container"><span>© 2026 ToolVault</span><span>Practical digital tools for smarter work.</span></div></footer>
<script>function generate(){let b=brand.value,t=topic.value,a=audience.value,n=["How-to guide","Quick tip","Common mistake","Checklist","FAQ","Myth vs fact","Case example","Behind the scenes","Expert insight","Resources"];let step=Math.max(1,Math.round(7/(+freq.value||3))),s=[];for(let d=1;d<=30;d+=step)s.push(`Day ${d}: ${n[(d-1)%n.length]} about ${t}\nAudience: ${a}\nBrand: ${b}\nCTA: Save or share.`);output.textContent=s.join("\n\n")}function copyIt(){navigator.clipboard.writeText(output.textContent)}generate();</script>
